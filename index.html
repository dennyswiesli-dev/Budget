<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lohnkalkulation – Finanz-Cockpit</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  /* Nocturne-Design-System-Tokens (siehe /_ds/nocturne-*/styles.css) - dieselben
     Variablennamen wie zuvor, damit alle bestehenden Komponenten automatisch
     mitziehen; Nocturne ist grundsätzlich dunkel, kein separates Hellmodus-Theme. */
  --bg:#101114; --bg-2:#17181d; --card:#1c1d22;
  --ink:#e9e9ed; --muted:#9397ab; --rule:color-mix(in srgb,#e9e9ed 10%,transparent); --rule-strong:color-mix(in srgb,#e9e9ed 20%,transparent);
  --primary:#9184d9; --primary-2:#a7a1db; --primary-ink:#d2cefd; --primary-soft:#423a6a;
  --input-bg:color-mix(in srgb,var(--primary) 10%,var(--bg));
  --plus:#8fd6a8; --plus-soft:#16321f; --minus:#e5a3a3; --minus-soft:#3a1f24;
  --warn:#e0b96b; --warn-soft:#3a2f18; --radius:14px; --radius-sm:8px;
  --shadow:0 0 0 1px #3f424d, 0 6px 18px rgba(0,0,0,.5);
  --shadow-sm:0 0 0 1px #3f424d;
  --on-soft:#f5f4ff; --toast-bg:#292b31;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color-scheme:dark}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100dvh;font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
h1,h2,h3{font-family:'Inter',sans-serif;font-weight:500;line-height:1.2;letter-spacing:-.015em}
.pos{color:var(--plus)} .neg{color:var(--minus)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

#authView{min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:28px 22px;background:var(--bg);color:var(--ink)}
.authCard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--radius);padding:30px 26px;box-shadow:var(--shadow)}
.brandMark{width:64px;height:64px;border-radius:var(--radius-sm);margin:0 auto 14px;display:block}
.authCard h1{font-size:1.7rem;text-align:center;margin-bottom:2px}
.authCard .sub{text-align:center;color:var(--muted);margin-bottom:24px;font-size:.92rem}
.field{margin-bottom:12px}
.field label{display:block;font-size:.76rem;margin-bottom:5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em}
#authView .field input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--rule-strong);background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s,background .15s}
#authView .field input:focus{border-color:var(--primary);background:var(--bg-2)}
.btn{display:block;width:100%;padding:12px;border-radius:var(--radius-sm);font-weight:600;text-align:center;
  transition:background .15s;background:transparent;border:1px solid transparent}
.btnPrimary{color:var(--primary);border-color:var(--primary);margin-top:6px}
.btnPrimary:hover{background:color-mix(in srgb,var(--primary) 12%,transparent)}
.btnGhost{border:1px solid var(--rule-strong);margin-top:10px;color:var(--ink)}
.btnGhost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.authLinks{display:flex;justify-content:space-between;margin-top:16px;font-size:.86rem}
.authLinks button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.authErr{background:var(--minus-soft);border:1px solid var(--minus);color:var(--minus);
  padding:10px 12px;border-radius:var(--radius-sm);font-size:.88rem;margin-bottom:12px}
.setupBox{background:var(--bg);border:1px dashed var(--rule-strong);
  border-radius:var(--radius-sm);padding:16px;font-size:.9rem;line-height:1.55}
.setupBox code{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--primary-ink)}

#appView{padding-bottom:calc(78px + min(34px,env(safe-area-inset-bottom)))}
header.appHead{background:var(--card);color:var(--ink);
  padding:max(34px,calc(26px + env(safe-area-inset-top))) 16px 12px;position:sticky;top:0;z-index:30;
  border-bottom:1px solid var(--rule)}
.headTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.headBrand{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto;overflow:hidden}
.headBrand img{width:30px;height:30px;border-radius:var(--radius-sm);flex:none}
.headBrand span:not(.saveDot){font-family:'Inter',sans-serif;font-weight:600;font-size:1.1rem;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.yearNav{display:flex;align-items:center;gap:2px;background:transparent;
  border:1px solid var(--rule-strong);border-radius:var(--radius-sm);padding:3px;overflow:hidden;flex:none}
.yearNav .y{font-family:'Inter',sans-serif;font-weight:600;font-size:1.05rem;min-width:52px;
  line-height:30px;text-align:center}
.yearNav button{width:28px;height:28px;border-radius:var(--radius-sm);color:var(--ink);font-size:1.05rem;
  opacity:.9;display:grid;place-items:center;flex:none}
.yearNav button:hover{background:color-mix(in srgb,var(--primary) 12%,transparent);opacity:1;color:var(--primary)}
.iconBtn{width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:1.05rem;
  background:transparent;border:1px solid var(--rule-strong);color:var(--ink);flex:none}
.iconBtn:hover{background:color-mix(in srgb,var(--primary) 10%,transparent);border-color:var(--primary);color:var(--primary)}

main{max-width:760px;margin:0 auto;padding:16px 12px 8px;transition:max-width .15s}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 14px;margin-bottom:14px;border:1px solid var(--rule);overflow-x:auto}
.cardGrid{display:block}
.cardGrid>.card{margin-bottom:14px}
@media(min-width:900px){
  main{max-width:1080px}
  .cardGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
  .cardGrid>.card{margin-bottom:0}
}
@media(min-width:1300px){ main{max-width:1360px} }
@media(min-width:1700px){ main{max-width:1600px} }
.card h3{font-size:1.05rem;margin-bottom:10px;color:var(--ink)}
.cardHeadRow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.cardHeadRow h3{margin:0}
.cardActions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.miniBtn{padding:8px 14px;border-radius:var(--radius-sm);background:transparent;color:var(--primary);
  border:1px solid var(--primary);font-size:.82rem;font-weight:600;white-space:nowrap;transition:background .12s}
.miniBtn:hover{background:color-mix(in srgb,var(--primary) 14%,transparent)}
.miniBtn:active{background:color-mix(in srgb,var(--primary) 24%,transparent)}
.miniBtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule-strong)}
.miniBtn.ghost:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.miniBtn.danger{background:transparent;color:var(--minus);border:1px solid var(--minus)}
.miniBtn.danger:hover{background:color-mix(in srgb,var(--minus) 14%,transparent)}
.miniBtn[disabled]{opacity:.45;pointer-events:none}
.hint{font-size:.82rem;color:var(--muted)}

/* Tabellen */
table.ledger{width:100%;max-width:100%;border-collapse:collapse;font-size:.87rem}
table.ledger th{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  text-align:right;padding:6px;border-bottom:1px solid var(--rule-strong);font-weight:600;white-space:normal;
  vertical-align:bottom}
table.ledger th:first-child, table.ledger td:first-child{text-align:left}
table.ledger td{padding:7px 6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.ledger tbody tr:hover{background:var(--bg)}
table.ledger td:first-child{white-space:normal;overflow-wrap:anywhere;text-align:left}
table.ledger td input{width:108px;max-width:100%;padding:6px 7px;border:1px solid var(--rule);border-radius:8px;
  background:var(--input-bg);text-align:right;font-variant-numeric:tabular-nums;font-size:.87rem;transition:border-color .12s,background .12s}
table.ledger td input.inpWide{width:130px}
input[data-path]{padding:6px 9px;border:1px solid var(--rule-strong);border-radius:8px;
  background:var(--input-bg);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;
  font-size:.87rem;transition:border-color .12s,background .12s}
input[data-path]:hover{border-color:var(--primary)}
input[data-path]:focus{border-color:var(--primary);background:var(--card);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
input::placeholder,table.ledger td input::placeholder{color:var(--muted);opacity:.85;font-style:italic}
.miniInp{padding:6px 9px;border:1px solid var(--rule-strong);border-radius:8px;width:90px;
  background:var(--input-bg);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;
  font-size:.87rem;transition:border-color .12s,background .12s}
.miniInp:hover{border-color:var(--primary)}
.miniInp:focus{border-color:var(--primary);background:var(--card);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
table.ledger td.labCol{width:99%;text-align:left;white-space:normal}
table.ledger td.satzCol{white-space:normal;max-width:88px}
.miniHint{display:block;white-space:normal;font-size:.62rem;line-height:1.2;color:var(--muted);margin-top:1px}
.labEdit{min-width:0;width:100%;text-align:left;font-family:'Inter',sans-serif;
  white-space:normal;overflow-wrap:anywhere;padding:5px 7px;border-radius:8px;
  border:1px solid var(--rule);background:var(--input-bg);line-height:1.3;transition:border-color .12s,background .12s}
.labEdit:hover{border-color:var(--rule-strong)}
.labEdit:focus{border-color:var(--primary);background:var(--bg-2);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
table.ledger td input:hover{border-color:var(--rule-strong)}
table.ledger td input:focus{border-color:var(--primary);background:var(--bg-2);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
table.ledger tr.sumRow td{border-top:2px solid var(--rule-strong);border-bottom:none;
  font-weight:700;padding-top:9px;color:var(--ink)}
.dblRule{border-bottom:2px solid var(--primary);display:inline-block;font-weight:700;padding-bottom:1px}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:right;margin-top:12px}
.kb .cap{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kb .val{font-size:1.05rem;font-weight:700;padding-top:3px;font-family:'Inter',sans-serif}
.rowDel{color:var(--muted);font-size:.95rem;padding:3px 7px;border-radius:8px}
.rowDel:hover{color:var(--minus);background:var(--minus-soft)}
.reorderGrp{display:inline-flex;gap:1px;white-space:nowrap}
.reorderGrp .rowDel[disabled]{opacity:.25;pointer-events:none}
.reorderGrp .rowDel:not(:last-child):hover{color:var(--primary);background:var(--primary-soft)}
.grpCap{padding:14px 4px 6px;border-bottom:1px solid var(--rule-strong)}
.grpCap .labEdit{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--on-soft);
  font-weight:700;padding:2px 4px;min-width:0}
.grpCap .labEdit:focus{color:var(--ink)}
.sectionCap{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  font-weight:700;margin:20px 6px 8px}
.statLine{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 4px;border-bottom:1px solid var(--rule);font-size:.9rem}
.statLine>span:first-child{flex:1;min-width:150px}
.statLine:last-child{border:none}
.statLine b{font-weight:600}
.chartBox{position:relative;width:100%;max-height:260px;min-height:200px}
@media(min-width:900px){.chartBox{max-height:320px}}
@media(min-width:900px){.chartBoxLg{max-height:420px}}
@media(min-width:1300px){.chartBoxLg{max-height:480px}}

/* Dezente Scrollbalken statt der grellen Browser-Standardleiste */
.scrollX,.card{scrollbar-width:thin;scrollbar-color:var(--rule-strong) transparent}
.scrollX::-webkit-scrollbar,.card::-webkit-scrollbar{height:6px;width:6px}
.scrollX::-webkit-scrollbar-track,.card::-webkit-scrollbar-track{background:transparent}
.scrollX::-webkit-scrollbar-thumb,.card::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:99px}
.scrollX::-webkit-scrollbar-thumb:hover,.card::-webkit-scrollbar-thumb:hover{background:var(--muted)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);display:flex;z-index:40;padding-bottom:min(34px,env(safe-area-inset-bottom))}
nav.tabs button{flex:1;padding:9px 0 6px;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:.6rem;color:var(--muted);font-weight:600;min-width:0;transition:color .15s}
nav.tabs button.on{color:var(--primary)}
nav.tabs .ico{line-height:1;transition:transform .15s;display:flex;justify-content:center}
nav.tabs .ico svg{width:19px;height:19px}
nav.tabs button.on .ico{transform:translateY(-2px)}

/* Sidebar-Navigation (Nocturne "1b") ab Tablet/Desktop-Breite statt Bottom-Tabs */
.sidebar{display:none}
@media(min-width:900px){
  nav.tabs{display:none}
  #appView{padding-bottom:0}
  .appBody{display:flex;align-items:flex-start}
  .sidebar{display:flex;flex-direction:column;gap:1px;width:184px;flex:none;
    padding:16px 10px;position:sticky;top:65px;height:calc(100dvh - 65px)}
  .sidebar button{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius-sm);
    color:var(--muted);font-size:13.5px;font-weight:600;text-align:left;transition:background .12s,color .12s}
  .sidebar button svg{width:17px;height:17px;flex:none}
  .sidebar button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
  .sidebar button.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
  .appBody>main{flex:1;min-width:0}
  .hamburgerBtn,.drawer,.drawerBackdrop{display:none!important}
}
.sidebarDivider{height:1px;background:var(--rule);margin:8px 6px}

/* Hamburger-Menü (Handy/Tablet <900px): zusätzliche Bereiche (Investitionen,
   FIRE, Einstellungen) leben hier statt die Bottom-Tab-Leiste zu überladen. */
.drawerBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:95}
.drawer{position:fixed;top:0;left:0;bottom:0;width:250px;max-width:82vw;background:var(--card);
  z-index:96;display:flex;flex-direction:column;gap:1px;padding:calc(16px + env(safe-area-inset-top)) 10px 16px;
  overflow-y:auto;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-md)}
.drawer.open{transform:translateX(0)}
.drawer button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--radius-sm);
  color:var(--muted);font-size:14.5px;font-weight:600;text-align:left;transition:background .12s,color .12s}
.drawer button svg{width:18px;height:18px;flex:none}
.drawer button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
.drawer button.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.drawerDivider{height:1px;background:var(--rule);margin:8px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + min(34px,env(safe-area-inset-bottom)));background:var(--toast-bg);color:#fff;
  padding:11px 20px;border-radius:99px;font-size:.86rem;z-index:60;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
.saveDot{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:inline-block;
  margin-left:6px;opacity:0;transition:opacity .3s;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.saveDot.on{opacity:1}
.pill{font-size:.7rem;background:var(--primary-soft);border-radius:99px;padding:3px 10px;color:var(--on-soft);font-weight:600;
  display:inline-flex;align-items:center;gap:4px}
.btnIco{width:13px;height:13px;flex:none;vertical-align:-2px;margin-right:3px}
.miniBtn .btnIco{margin-right:5px}
.fixActions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.monthGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0;width:100%;box-sizing:border-box}
@media(min-width:420px){.monthGrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:640px){.monthGrid{grid-template-columns:repeat(6,1fr)}}
.monthChip{position:relative;display:flex;flex-direction:row;align-items:center;justify-content:center;padding:9px 4px;
  border-radius:12px;background:var(--primary-soft);color:var(--on-soft);font-weight:600;
  font-size:.78rem;cursor:pointer;user-select:none;transition:background .15s,color .15s;
  white-space:nowrap;overflow:hidden;min-width:0;width:100%;box-sizing:border-box;text-align:center}
.monthChip.on{background:var(--primary);color:#fff}
.monthChip span{white-space:nowrap;pointer-events:none}
.monthChip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
h3 input.titleInp{font-family:'Inter',sans-serif;font-weight:700;font-size:1.05rem;
  border:none;background:transparent;width:100%;padding:2px 0}
h3 input.titleInp:focus{outline:none;border-bottom:2px solid var(--primary)}
.cardHeadRow h3{flex:1;min-width:0}
.dateCol{text-align:left;white-space:nowrap;width:1%}
.dateCol .labEdit{min-width:92px;white-space:nowrap;overflow-wrap:normal}
.cardNow{border-top:3px solid var(--plus);position:relative}
.cardNext{border-top:3px solid var(--warn);position:relative}
.tag{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  border-radius:99px;padding:4px 10px;vertical-align:middle;margin-left:8px}
.tagNow{background:var(--plus-soft);color:var(--plus)}
.tagNext{background:var(--warn-soft);color:var(--warn)}
.scrollX{overflow-x:auto;margin:0 -12px;padding:0 12px}
.scrollX table.ledger td:first-child, .scrollX table.ledger th:first-child{
  position:sticky;left:0;background:var(--card);z-index:2}
.bar{height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--plus),#22C55E);transition:width .4s}
.bar.warn>i{background:linear-gradient(90deg,var(--warn),#FBBF24)} .bar.over>i{background:linear-gradient(90deg,var(--minus),#F43F5E)}
.dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dashCell{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-sm);padding:13px}
.dashCell .cap{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dashCell .val{font-size:1.2rem;font-weight:700;margin-top:4px;font-family:'Inter',sans-serif}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
@media(max-width:430px){
  table.ledger{font-size:.76rem}
  table.ledger td{padding:4px 2px;white-space:normal}
  table.ledger td:first-child{white-space:normal}
  table.ledger td input{width:56px;font-size:.76rem;padding:4px 2px}
  table.ledger td input.inpWide{width:98px}
  table.ledger td.satzCol{max-width:66px}
  .miniHint{font-size:.58rem}
  table.ledger th{font-size:.58rem;padding:4px 2px}
  .pill{font-size:.6rem;padding:2px 7px}
  .kb .val{font-size:.94rem}
  main{padding:12px 8px 8px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="authView" class="hidden">
  <div class="authCard">
    <img src="icon-192.png" alt="Logo" class="brandMark">
    <h1>Lohnkalkulation</h1>
    <p class="sub">Dein Finanz-Cockpit – Monat, Vermögen, Fixkosten &amp; FIRE.</p>
    <div id="setupNotice" class="setupBox hidden">
      <strong>Einrichtung nötig:</strong> In <code>index.html</code> fehlt deine
      Firebase-Konfiguration (<code>FIREBASE_CONFIG</code>). Anleitung: <code>README.md</code>.
    </div>

// Chart.js-Plugin: schreibt den Endwert jeder Linie als kleines Label neben
// deren letzten Punkt (in derselben Farbe). Labels werden nach ihrer echten
// y-Position sortiert und bei Bedarf auseinandergeschoben, damit eng

const endLabelPlugin={
  id:'endLabel',
  afterDatasetsDraw(chart){
    const {ctx}=chart;
    const labels=[];
    chart.data.datasets.forEach((ds,di)=>{
      const meta=chart.getDatasetMeta(di);
      if(meta.hidden||!meta.data.length) return;
      const pt=meta.data[meta.data.length-1];
      const v=ds.data[ds.data.length-1];
      if(v==null) return;
      labels.push({x:pt.x,y:pt.y,color:ds.borderColor,text:Math.round(v/1000)+'k'});
    });
    labels.sort((a,b)=>a.y-b.y);
    const minGap=12;
    for(let i=1;i<labels.length;i++){
      if(labels[i].y-labels[i-1].y<minGap) labels[i].y=labels[i-1].y+minGap;
    }
    ctx.save();
    ctx.font='600 10px Inter, sans-serif';
    ctx.textBaseline='middle';
    labels.forEach(l=>{ ctx.fillStyle=l.color; ctx.fillText(l.text,l.x+6,l.y); });
    ctx.restore();
  }
};

function getPath(root,path){return path.split('.').reduce((o,k)=>o?.[k],root);}
function setPath(root,path,val){const ks=path.split('.');const last=ks.pop();
  const o=ks.reduce((o,k)=>o[k],root); o[last]=val;}
function inp(path,val,opts={}){
  if(opts.lab) return '<div class="labEdit" contenteditable="plaintext-only" '+
    'data-path="'+path+'" data-kind="text">'+esc(val)+'</div>';
  const kind=opts.kind||'num';
  const shown=kind==='num'?fmtInp(val):kind==='int'?fmtIntInp(val):kind==='pct'?fmtPct(val):(val??'');
  const ph=opts.placeholder?' placeholder="'+esc(opts.placeholder)+'"':'';
  const cls=opts.cls?' class="'+opts.cls+'"':'';
  return '<input data-path="'+path+'" data-kind="'+kind+'"'+ph+cls+' value="'+shown+'">';
}
document.addEventListener('focusout',e=>{
  const el=e.target;
  if(!el.classList||!el.classList.contains('labEdit')||!el.dataset.path) return;
  const scope=el.dataset.scope||'year';
  const root=scope==='settings'?settings:Y();
  const newVal=el.textContent.trim();
  if(scope==='year'&&/^accounts\.\d+\.name$/.test(el.dataset.path)){
    const oldVal=getPath(root,el.dataset.path);
    // Referenzen (13. Lohn, Notgroschen-Markierung) bei Umbenennung mitziehen,
    // damit sie nicht durch einen Namenswechsel stillschweigend brechen.
    if(oldVal!==newVal){
      if(root.netto?.lohn13Konto===oldVal) root.netto.lohn13Konto=newVal;
      if(settings.notgroschenAccName===oldVal){ settings.notgroschenAccName=newVal; save('settings'); }
      if(settings.depotAccNames?.includes(oldVal)){
        settings.depotAccNames=settings.depotAccNames.map(n=>n===oldVal?newVal:n); save('settings');
      }
      if(settings.dayLockedAccNames?.includes(oldVal)){
        settings.dayLockedAccNames=settings.dayLockedAccNames.map(n=>n===oldVal?newVal:n); save('settings');
      }
      if(settings.sparquoteExcludedAccNames?.includes(oldVal)){
        settings.sparquoteExcludedAccNames=settings.sparquoteExcludedAccNames.map(n=>n===oldVal?newVal:n); save('settings');
      }
      if(settings.lohnkontoAccName===oldVal){ settings.lohnkontoAccName=newVal; save('settings'); }
      if(openAccOptions.has(oldVal)){ openAccOptions.delete(oldVal); openAccOptions.add(newVal); }
    }
  }
  setPath(root,el.dataset.path,newVal);
  save(scope==='settings'?'settings':year);
  renderTab();
});
document.addEventListener('change',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.path||el.classList.contains('labEdit')) return;

  const val=kind==='num'?pAmt(el.value):kind==='int'?pInt(el.value):kind==='rate'?pRate(el.value):kind==='pct'?pPct(el.value):kind==='bool'?el.checked:el.value;

// Jährlicher Netto-Zufluss eines Kontos (＋ − −, inkl. Prognose & 13. Lohn) -
// von renderDash (Sparquote) und der FIRE-Lebenszyklus-Simulation genutzt.
function acctGespart(ac){
  const dayLocked=isDayLockedName(ac.name);
  return (ac.months||[]).reduce((x,m,mi)=>{
    const pending=dayLocked&&monthIsCurrentPending(mi);
    const plusEff=pending?0:((m.plus||0)||(m.prognose!=null?m.prognose:0));
    const minusEff=pending?0:(m.minus||0);
    return x+plusEff-minusEff;
  },0)+lohn13For(ac);
}
function renderDash(){
  if(!years[year]){renderMonat();$('tabDash').innerHTML=$('tabMonat').innerHTML;return;}
  const yy=Y();
  const c=calcSide(yy.calc.current);
  const accs=yy.accounts||[];
  const nowMi=(year===String(new Date().getFullYear()))?new Date().getMonth():11;
  const rendite=depotRendite(yy);
  const nw=accs.reduce((a,ac)=>a+acctSaldoAt(ac,nowMi),0)+rendite;
  const nwStart=accs.reduce((a,ac)=>a+(ac.start||0),0);
  const gespart=accs.filter(ac=>!isSparquoteExcludedName(ac.name)).reduce((a,ac)=>a+acctGespart(ac),0);
  const lohnJahr=yy.lohnJahr||Math.round(c.inc*13);
  const bonus=yy.bonus||0, bonusIncl=!!yy.bonusIncl;
  const lohnEffektiv=lohnJahr+(bonusIncl?bonus:0);
  const sparquote=lohnEffektiv?gespart/lohnEffektiv*100:0;
  const fire=settings.fire||{};
  const fSum=fixFireTotal(yy.fixkosten||{})+ccAnnualEstimate(yy)+(fire.items||[]).reduce((a,i)=>a+(i.value||0),0);
  const noetig=fire.entnahmerate?fSum/fire.entnahmerate:0;
  const notAcc=findNotAcc(accs);
  const notSaldo=notAcc?acctSaldoAt(notAcc,nowMi):0;
  const notZiel=settings.notgroschenZiel||30000;
  const projRendite=settings.projRendite||0;
  const projYears=Math.max(1,Math.min(60,settings.projYears||20));
  // Rendite wird nur auf die als Depot markierten Konten angewendet (Aktien/Fonds);
  // Sparkonten etc. wachsen in der Hochrechnung nur durch die eingezahlten Beträge,
  // da dort real kaum Zins/Rendite anfällt. Basis ist der heutige Stand (nicht die
  // Jahresend-Prognose), damit die Hochrechnung mit dem realen Kontostand übereinstimmt.
  const projDepotAccs=findDepotAccs(accs);
  const projDepotToday=projDepotAccs.reduce((a,ac)=>a+acctSaldoAt(ac,nowMi),0)+rendite;
  const projOtherToday=nw-projDepotToday;
  const projDepotGespart=projDepotAccs.reduce((a,ac)=>a+acctGespart(ac),0);
  const projOtherGespart=gespart-projDepotGespart;
  const projLabels=Array.from({length:projYears+1},(_,i)=>String(+year+i));
  const projScenario=rate=>Array.from({length:projYears+1},(_,i)=>{
    let vd=projDepotToday, vo=projOtherToday;
    for(let k=0;k<i;k++){ vd=vd*(1+rate)+projDepotGespart; vo=vo+projOtherGespart; }
    return Math.round(vd+vo); });
  // Drei Szenarien statt nur einer festen Rendite - Pessimistisch/Optimistisch
  // sind editierbar, weichen aber standardmässig ±2%-Punkte vom Realistisch-Wert ab.
  const projRenditePess=settings.projRenditePess!=null?settings.projRenditePess:Math.max(0,projRendite-0.02);
  const projRenditeOpt=settings.projRenditeOpt!=null?settings.projRenditeOpt:projRendite+0.02;
  const projInflation=settings.projInflation!=null?settings.projInflation:0.02;
  const projData=projScenario(projRendite);
  const projDataPess=projScenario(projRenditePess);
  const projDataOpt=projScenario(projRenditeOpt);
  const projDataReal=projData.map((v,i)=>Math.round(v/Math.pow(1+projInflation,i)));
  let h='<div class="dashGrid">'+

    '<div class="dashCell"><div class="cap">Mögliches Sparen</div>'+
      '<div class="val num '+(c.moegl<0?'neg':'pos')+'">'+fmt(c.moegl)+'</div></div>'+
    '<div class="dashCell"><div class="cap">Nettowert ('+MONTHS[nowMi].slice(0,3)+')</div>'+
      '<div class="val num">'+fmt(nw)+'</div></div>'+
    '<div class="dashCell"><div class="cap">Zuwachs bis heute</div>'+
      '<div class="val num '+(nw-nwStart<0?'neg':'pos')+'">'+fmt(nw-nwStart)+'</div></div>'+
    '</div>';
  if(rendite) h+='<p class="hint" style="margin:6px 6px 0">Im Nettowert enthalten: Depot-Kursgewinn/-verlust '+
    '<b class="num '+(rendite<0?'neg':'pos')+'">'+fmt(rendite)+'</b> (Stand letzter erfasster Depotwert, siehe Investitionen → Depot-Wertentwicklung).</p>';
  h+='<div class="card" style="margin-top:12px"><h3>Sparquote '+year+'</h3>'+
    '<div class="statLine"><span>Gespart (alle Konten, ＋ − −, inkl. 13. Lohn falls gebucht)</span><b class="num pos">'+fmt(gespart)+'</b></div>'+
    '<div class="statLine"><span>Jahreslohn (editierbar)</span><b>'+inp('lohnJahr',lohnJahr)+'</b></div>'+
    '<div class="statLine"><span>Bonus (optional, nicht garantiert)</span><b>'+inp('bonus',bonus)+'</b></div>'+
    '<div class="statLine"><span>Bonus zur Sparquote hinzurechnen</span>'+
    '<label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">'+
    '<input type="checkbox" data-path="bonusIncl" data-kind="bool" style="width:18px;height:18px;accent-color:var(--primary)"'+(bonusIncl?' checked':'')+'></label></div>'+
    '<div class="statLine"><span>Sparquote'+(bonusIncl?' (inkl. Bonus)':'')+'</span><b class="num"><span class="dblRule">'+sparquote.toFixed(1)+' %</span></b></div>'+
    bar(sparquote*2.5)+'<p class="hint" style="margin-top:5px">Balken voll bei 40 % Sparquote</p></div>';
  h+='<div class="card"><h3>Notgroschen (Regel 2)</h3>'+
    '<div class="statLine"><span>'+esc(notAcc?notAcc.name:'Sparkonto')+'</span>'+
    '<b class="num">'+fmt(notSaldo)+' / '+fmt(notZiel)+'</b></div>'+bar(notSaldo/notZiel*100,80)+'</div>';
  h+='<div class="card"><h3>FIRE-Fortschritt</h3>'+

    '<div class="statLine" style="border:none"><span>Fortschritt</span><b class="num">'+

    '<b><input data-scope="settings" data-path="projInflation" data-kind="pct" value="'+fmtPct(projInflation)+'" style="width:70px"></b></div>'+
    '<p class="hint" style="margin-top:4px">Ab heutigem Stand ('+fmt(nw)+'), jährlich + '+fmt(gespart)+

    (projDepotAccs.length?'Die Renditen wirken nur auf Depot-Konten, nicht auf die übrigen.':'Keine Konten als Depot markiert – die Renditen wirken aktuell auf nichts.')+
    ' In '+(+year+projYears)+' (Realistisch): '+fmt(projData[projYears])+' nominal, '+fmt(projDataReal[projYears])+' in heutiger Kaufkraft.</p></div>';
  h+='<div class="card"><details><summary style="font-family:\'Inter\',sans-serif;font-weight:700;font-size:1.05rem;cursor:pointer">Wie wird gerechnet?</summary>'+

/* ================= KONTEN ================= */
// Solange kein tatsächlicher "+"-Wert erfasst ist, wird die Prognose als
// angenommener Zufluss verwendet (Hochrechnung Jahresende). Sobald ein
// echter "+"-Wert eingetragen wird, ersetzt dieser die Prognose.
// lohn13 wird rein rechnerisch on top des Dezember-Zuflusses berücksichtigt,
// ohne das "+"-Feld selbst zu überschreiben (Platz für den normalen
// Spartransfer bleibt erhalten).
// Regelmässige Zu-/Abgänge passieren bei manchen Konten erst um einen
// bestimmten Tag im Monat (z.B. 26.). Vor diesem Tag ist der laufende Monat
// dort noch nicht wirklich passiert. Das gilt nur für explizit markierte
// Konten (Depot / Notgroschen / manuell per "Tages-Sperre" markiert) -
// bei normalen Konten würde das sonst bereits real eingetragene Werte
// (z.B. weil der Lohn schon eingegangen ist) fälschlich unterschlagen.
function isDepotName(name){ return (settings.depotAccNames||[]).includes(name); }
// Konten wie eine BVG-/Vorsorgeeinlage, deren Einzahlungen bereits vor dem
// getrackten Nettolohn abgezogen wurden - würden sonst als zusätzliches
// "Sparen" gezählt und die Sparquote künstlich aufblähen. Zählen weiterhin
// normal zum Total-Nettowert, fliessen aber nicht in die Sparquote ein.
function isSparquoteExcludedName(name){ return (settings.sparquoteExcludedAccNames||[]).includes(name); }
function isNotgroschenName(name){
  if(settings.notgroschenAccName!=null) return settings.notgroschenAccName===name;
  return /sparkonto/i.test(name)&&!/steuer/i.test(name);
}
function isDayLockedName(name){
  return (settings.dayLockedAccNames||[]).includes(name);
}
function monthIsCurrentPending(mi){
  const now=new Date();
  if(String(year)!==String(now.getFullYear())) return false;
  return mi===now.getMonth()&&now.getDate()<(settings.depotTransferDay||26);
}
function accountSaldi(a){
  const dayLocked=isDayLockedName(a.name);
  let run=a.start||0; const saldi=[]; const prog=[]; const wait=[];
  let deferred=0; // bereits echt erfasste Werte eines gesperrten Monats, die erst im Folgemonat zählen
  (a.months||[]).forEach((m,mi)=>{
    const pending=dayLocked&&monthIsCurrentPending(mi);
    const applyDeferred=deferred; deferred=0;
    // Tages-gesperrte Konten (Depot/Notgroschen/manuell markiert): der laufende
    // Monat zählt komplett erst ab dem Transfertag - egal ob echter Wert oder
    // Prognose. Bereits real erfasste Werte gehen dabei nicht verloren, sondern
    // werden im Folgemonat nachgezogen (dort ist die Buchung ja definitiv erfolgt).
    // Bei Depot wird das zusätzlich 1:1 durch die Depot-Rendite ausgeglichen.
    const plusEff=pending?0:((m.plus||0)||(m.prognose!=null?m.prognose:0));
    const minusEff=pending?0:(m.minus||0);
    if(pending) deferred=(m.plus||0)-(m.minus||0);
    const usedProg=!pending&&!m.plus&&m.prognose!=null&&plusEff===m.prognose;
    run=Math.round((run+applyDeferred+plusEff-minusEff)*100)/100;
    saldi.push(run); prog.push(usedProg); wait.push(pending);
  });
  // Lohnkonto-Sync: statt jeden Monat manuell ＋/− zu pflegen, wird für den
  // aktuellen Kalendermonat direkt das im Monat-Tab gepflegte "Startkapital
  // Zahlungskonto" übernommen (dort wird es ohnehin laufend aktualisiert).
  if(settings.lohnkontoAccName===a.name){
    const now=new Date();
    if(String(year)===String(now.getFullYear())){
      const mi=now.getMonth();
      if(saldi[mi]!=null) saldi[mi]=Y().calc?.current?.start??saldi[mi];
    }
  }
  saldi.usedProg=prog; saldi.waiting=wait;
  return saldi;
}
function lohn13For(a){ return Y().netto?.lohn13Konto===a.name?(Y().netto.lohn13Applied||0):0; }
// Notgroschen-Konto: explizite Markierung (settings.notgroschenAccName) hat Vorrang,
// sonst automatische Erkennung am Namen als Fallback (Altdaten/Erstnutzung).
function findNotAcc(accs){
  if(settings.notgroschenAccName!=null){
    return accs.find(a=>a.name===settings.notgroschenAccName);
  }
  return accs.find(a=>/sparkonto/i.test(a.name)&&!/steuer/i.test(a.name));
}
// Depot-/Investitionskonten: eine oder mehrere explizite Markierungen
// (settings.depotAccNames), da Investitionen oft über mehrere Konten
// (z.B. Broker + Säule 3a) verteilt sind.
function findDepotAccs(accs){
  const names=settings.depotAccNames||[];
  return accs.filter(a=>names.includes(a.name));
}
// Kumulierte Netto-Einzahlungen der Depot-Konten über ALLE Jahre bis targetYear,
// nicht nur innerhalb des einen Jahres (Investieren läuft ja meist schon länger).
function depotEingezahltSeries(targetYear){
  const names=settings.depotAccNames||[];
  const allYearNums=Object.keys(years).map(Number).sort((a,b)=>a-b);
  let base=0;
  names.forEach(name=>{
    for(const y of allYearNums){
      const acc=(years[String(y)].accounts||[]).find(a=>a.name===name);
      if(acc){ base+=acc.start||0; break; }
    }
  });
  allYearNums.filter(y=>y<+targetYear).forEach(y=>{
    names.forEach(name=>{
      const acc=(years[String(y)].accounts||[]).find(a=>a.name===name);
      if(acc) (acc.months||[]).forEach(m=>base+=(m.plus||0)-(m.minus||0));
    });
  });
  base=Math.round(base*100)/100;
  const invByMonth=Array(12).fill(0);
  const ty=years[String(targetYear)];
  names.forEach(name=>{
    const acc=(ty?.accounts||[]).find(a=>a.name===name);
    if(acc) (acc.months||[]).forEach((m,mi)=>invByMonth[mi]+=(m.plus||0)-(m.minus||0));
  });
  // Regelmässige Transfers/Investitionen passieren erst um einen bestimmten Tag
  // im Monat (z.B. 26.) - vor diesem Tag ist der laufende Monat im Depotwert
  // noch nicht angekommen, darf also auch bei "Eingezahlt" noch nicht mitzählen.
  const now=new Date();
  if(String(targetYear)===String(now.getFullYear())){
    const transferDay=settings.depotTransferDay||26;
    if(now.getDate()<transferDay) invByMonth[now.getMonth()]=0;
  }
  let cum=base; return invByMonth.map(v=>cum=Math.round((cum+v)*100)/100);
}
// Depot-Rendite (Kursgewinn/-verlust): letzter erfasster Depotwert minus die
// Kontosalden der Depot-Konten im selben Monat (nicht die separate
// Mehrjahres-"Eingezahlt"-Serie - deren Monat kann vom letzten erfassten
// Depotwert abweichen, was sonst Beiträge zwischen den beiden Monaten
// doppelt bzw. gar nicht zählen würde, sobald man den Depotwert nicht jeden
// Monat pflegt). Wird zusätzlich zu den reinen Kontosalden (die nur
// Zahlungsbewegungen abbilden) zum Nettowert addiert, da sonst
// Kursgewinne im Depot nirgends im Vermögen auftauchen würden.
function depotRendite(yy){
  const depotAccs=findDepotAccs(yy.accounts||[]);
  if(!depotAccs.length) return 0;
  const dw=yy.depotwerte||[];
  let lastWertMi=-1; dw.forEach((w,mi)=>{ if(w!=null) lastWertMi=mi; });
  if(lastWertMi<0) return 0;
  const saldoAtWert=depotAccs.reduce((a,ac)=>a+acctSaldoAt(ac,lastWertMi),0);
  return Math.round((dw[lastWertMi]-saldoAtWert)*100)/100;
}
// Saldo eines Kontos am Ende von Monat mi (0-11), inkl. 13. Monatslohn ab Dezember
function acctSaldoAt(a,mi){ const s=accountSaldi(a)[mi]; return mi===11?s+lohn13For(a):s; }

/* ================= FIXKOSTEN ================= */
const abgOf=m=>m.abg!=null?m.abg:(m.abgaenge||[]).reduce((a,x)=>a+x,0);
// Monats-Zuordnung einer Position per Checkbox: welche Monate sind angehakt.
// Ohne jede Markierung gilt die Position als "nicht zugeordnet" (Default:
// Januar), damit die meisten (nur 1x/Jahr fälligen) Positionen nicht einzeln
// auf 12 Monate verteilt werden müssen - nur die wenigen echten Raten-Fälle
// brauchen mehrere Haken.
function fixItemFlags(i){
  if(Array.isArray(i.flags)&&i.flags.length===12) return i.flags;
  return MONTHS.map((_,mi)=>mi===0);
}
// Betrag pro angehaktem Monat = Total ÷ Anzahl Haken (Rundungsrest landet im
// letzten angehakten Monat). Ändert sich der Total-Betrag, folgt die
// Verteilung automatisch - die Haken selbst müssen nicht angepasst werden.
function fixItemMonthAmounts(i){
  const flags=fixItemFlags(i);
  const n=flags.filter(Boolean).length;
  const arr=MONTHS.map(()=>0);
  if(!n) return arr;
  const total=Math.round((i.value||0)*100)/100;
  const per=Math.round((total/n)*100)/100;
  let lastMi=-1;
  flags.forEach((f,mi)=>{ if(f){ arr[mi]=per; lastMi=mi; } });
  const diff=Math.round((total-Math.round(arr.reduce((a,x)=>a+x,0)*100)/100)*100)/100;
  if(diff&&lastMi>=0) arr[lastMi]=Math.round((arr[lastMi]+diff)*100)/100;
  return arr;
}
function fixItemTotal(i){ return i.value||0; }
// Abgänge pro Monat werden automatisch aus der Monats-Zuordnung der Positionen
// berechnet - Steuern, Strom etc. lassen sich so auf die tatsächlichen
// Fälligkeitsmonate verteilen statt pauschal Total÷12 anzunehmen.
function fixAbgByMonth(fk){
  const arr=MONTHS.map(()=>0);
  (fk.items||[]).forEach(i=>fixItemMonthAmounts(i).forEach((v,mi)=>arr[mi]+=(v||0)));
  return arr.map(v=>Math.round(v*100)/100);
}

// FIRE-Tab) - z.B. Steuern oder Militär lassen sich davon
// ausschliessen, weil sie ab FIRE ganz anders (tiefer/gar nicht) anfallen.
// Betrifft nur die FIRE-Summe, nicht Total/Ø/Abgänge hier im Fixkosten-Tab.
function fixFireTotal(fk){
  return (fk.items||[]).reduce((a,i)=>a+(i.fireExcluded?0:fixItemTotal(i)),0);
}

/* ================= KREDITKARTEN ================= */
const ccTot=e=>e.amount!=null?e.amount:(e.amounts||[]).reduce((a,x)=>a+x,0);
// Monats-Durchschnitt einer Kreditkarten-Liste (Eigene/Gemeinsame Karte), ohne
// die Original-Daten zu verändern - nur Monate mit Wert (oder Ferienanteil)
// zählen mit, damit ein unvollständiges Jahr trotzdem einen sinnvollen
// Durchschnitt ergibt.
function ccStats(rows){
  const padded=(rows||[]).slice(0,12);
  while(padded.length<12) padded.push({amounts:[]});
  const totals=padded.map(ccTot);
  const ferien=padded.map(r=>r.ferien||0);
  const n=totals.filter((t,i)=>t>0||ferien[i]>0).length||1;
  const avg=totals.reduce((a,x)=>a+x,0)/n;
  const avgNormal=(totals.reduce((a,x)=>a+x,0)-ferien.reduce((a,x)=>a+x,0))/n;
  return {avg,avgNormal,n};
}
// Kreditkarten-Jahreskosten für FIRE: Ø/Monat × 12 (fehlende Monate werden so
// automatisch hochgerechnet). Bei der gemeinsamen Karte zählt nur der eigene
// Anteil (½) am "normalen" Betrag, ohne Ferien/Einmalig-Anteil.
function ccAnnualEstimate(yy){
  const own=ccStats(yy.ccOwn||[]);
  const shared=ccStats(yy.ccShared||[]);
  return Math.round((own.avg*12+shared.avgNormal/2*12)*100)/100;
}

/* ================= NETTOLOHN ================= */
const r05=x=>Math.round(x*20)/20;   // Schweizer Rappenrundung auf 5 Rp.
const rd2=x=>Math.floor(x*100)/100; // Abrunden auf Rappen (ROUNDDOWN,2)
const defaultNetto=()=>({brutto12:0,brutto13:0,items:[
  {label:'AHV-Beitrag',rate:0.053},{label:'ALV-Beitrag',rate:0.011},
  {label:'UVG-Beitrag NBU',rate:0.0089},{label:'PK-BVG-Beitrag',fix:0,isPk:true},
  {label:'KTG-Beitrag',rate:0.01433}],
  bvg:{hoechstlohn:90720,koordinationsabzug:26460,jahreslohn:0,sparsatz:0.07,zusatzsatz:0.0222658}});
function bvgCalc(b){
  const vers=Math.max(0,Math.min(b.jahreslohn||0,b.hoechstlohn||0)-(b.koordinationsabzug||0));
  const spar=vers*(b.sparsatz||0), zusatz=vers*(b.zusatzsatz||0);
  const anJahr=r05((spar+zusatz)/2);
  return {vers,spar,zusatz,anJahr,anMonat:r05(anJahr/12)};
}
// BVG-Jahreslohn wird live aus dem Bruttolohn abgeleitet (12 Monatslöhne + 13.),
// nicht mehr separat erfasst.
function bvgLive(n){
  const b=n.bvg||defaultNetto().bvg;
  const jahreslohn=Math.round((12*(n.brutto12||0)+(n.brutto13||0))*100)/100;
  return {...bvgCalc({...b,jahreslohn}),jahreslohn};
}
function nettoCalc(n){
  // wie Excel: 12-Monatslöhne zuerst auf Rappen abrunden, dann auf 5 Rp. runden;
  // 13. direkt auf 5 Rp. runden (ohne Abrunden). Der PK-BVG-Fixbetrag wird live aus
  // der BVG-Berechnung gespiegelt statt manuell übernommen zu werden.
  const pkMonat=bvgLive(n).anMonat;
  const rows=(n.items||[]).map(it=>{
    const isPk=it.isPk||/pk|bvg/i.test(it.label||'');
    const fixVal=isPk?pkMonat:(it.fix||0);
    return {a12:it.rate?r05(rd2((n.brutto12||0)*it.rate)):fixVal,
      a13:it.rate?r05((n.brutto13||0)*it.rate):0};
  });
  const s12=rows.reduce((a,x)=>a+x.a12,0), s13=rows.reduce((a,x)=>a+x.a13,0);
  const n12=(n.brutto12||0)-s12, n13=(n.brutto13||0)-s13;
  return {rows,n12,n13,jahr:Math.round((12*n12+n13)*100)/100};
}

  const yy=Y();
  if(!yy.netto) yy.netto=defaultNetto();

    '<td>'+inp('netto.brutto12',n.brutto12)+'</td><td>'+inp('netto.brutto13',n.brutto13)+

    '</td><td></td></tr>';

  (n.items||[]).forEach((it,ix)=>{
    const isPk=it.isPk||/pk|bvg/i.test(it.label||'');
    h+='<tr><td class="labCol">'+inp('netto.items.'+ix+'.label',it.label,{lab:1,kind:'text'})+'</td>'+
      '<td class="satzCol">'+(it.rate!=null&&!it.fix?inp('netto.items.'+ix+'.rate',it.rate,{kind:'pct'}):

        (n.brutto12?(c.rows[ix].a12/n.brutto12*100).toFixed(1):'0.0')+'%</span>')+'</td>'+
      '<td class="num neg">−'+fmt(c.rows[ix].a12)+'</td>'+

      '<td><button class="rowDel" data-act="del" data-p="netto.items" data-i="'+ix+'">✕</button></td></tr>';});
  h+='<tr class="sumRow"><td>Nettolohn</td><td></td>'+
    '<td class="num"><span class="dblRule">'+fmt(c.n12)+'</span></td>'+

  h+='</tbody></table></div>'+

    '<div class="statLine"><span>Für Sparquote in der Übersicht verwenden</span>'+
    '<button class="miniBtn" data-act="lohnApply">Übernehmen</button></div>'+

    '<div class="statLine"><span>13. Monatslohn ('+fmt(c.n13)+') ins Sparkonto Dezember buchen'+
    (n.lohn13Applied?'<br><span class="hint">Zuletzt gebucht: '+fmt(n.lohn13Applied)+' in „'+esc(n.lohn13Konto||'')+'“</span>':'')+'</span>'+

  h+='<div class="card"><h3>BVG-Pensionskasse</h3>'+
    '<div class="statLine"><span>Höchstlohn</span><b>'+inp('netto.bvg.hoechstlohn',b.hoechstlohn)+'</b></div>'+

    '<div class="statLine"><span>Versicherter Lohn</span><b class="num">'+fmt(bc.vers)+'</b></div>'+

    '<div class="statLine"><span>Zusatzkosten-Satz (%)</span><b>'+inp('netto.bvg.zusatzsatz',b.zusatzsatz,{kind:'pct'})+'</b></div>'+
    '<div class="statLine"><span>Sparbeitrag / Jahr</span><b class="num">'+fmt(bc.spar)+'</b></div>'+
    '<div class="statLine"><span>Zusatzkosten / Jahr</span><b class="num">'+fmt(bc.zusatz)+'</b></div>'+
    '<div class="statLine"><span>Arbeitnehmerabzug / Jahr (½)</span><b class="num">'+fmt(bc.anJahr)+'</b></div>'+
    '<div class="statLine"><span>Arbeitnehmerabzug / Monat</span>'+
    '<b class="num"><span class="dblRule">'+fmt(bc.anMonat)+'</span></b></div>'+
    '<p class="hint" style="margin-top:4px">Wird automatisch oben als PK-BVG-Abzug verwendet – kein manuelles Übernehmen mehr nötig.</p></div>';
  return h;
}

function renderFireTab(){

  const ccSum=ccAnnualEstimate(yy);
  const fireExtraSum=(fire.items||[]).reduce((a,i)=>a+(i.value||0),0);
  const fSum=fixSum+ccSum+fireExtraSum;
  const noetig=fire.entnahmerate?fSum/fire.entnahmerate:0;
  let h='<p class="sectionCap">FIRE-Berechnung</p><div class="card">'+
    '<p class="hint" style="margin-bottom:8px">Fixkosten und Kreditkarten fliessen automatisch ein (spiegeln Fixkosten- bzw. Kreditkarten-Tab; bei unvollständigem Jahr wird Ø/Monat × 12 hochgerechnet). Zusätzlich lassen sich variable Jahreskosten wie Urlaub oder Essen ergänzen, die dort nicht erfasst sind.</p>'+
    '<table class="ledger"><tbody>'+
    '<tr><td class="labCol">Fixkosten '+year+' <span class="hint">(automatisch, nur „Für FIRE“-Positionen'+(fixSumAll>fixSum?' – '+fmt(fixSumAll-fixSum)+' ausgeschlossen':'')+', siehe Fixkosten-Tab)</span></td>'+
    '<td class="num">'+fmt(fixSum)+'</td><td></td></tr>'+
    '<tr><td class="labCol">Kreditkarten <span class="hint">(automatisch, Ø/Monat × 12)</span></td>'+
    '<td class="num">'+fmt(ccSum)+'</td><td></td></tr>';
  (fire.items||[]).forEach((i,ix)=>{
    h+='<tr><td class="labCol"><div class="labEdit" contenteditable="plaintext-only" data-scope="settings" data-path="fire.items.'+ix+'.label">'+esc(i.label)+'</div></td>'+
      '<td><input data-scope="settings" data-path="fire.items.'+ix+'.value" data-kind="num" value="'+fmtInp(i.value)+'"></td>'+
      '<td><span class="reorderGrp">'+
      '<button class="rowDel" data-act="moveFireUp" data-i="'+ix+'" '+(ix===0?'disabled':'')+'>↑</button>'+
      '<button class="rowDel" data-act="moveFireDown" data-i="'+ix+'" '+(ix===fire.items.length-1?'disabled':'')+'>↓</button>'+
      '<button class="rowDel" data-act="delFire" data-i="'+ix+'">✕</button></span></td></tr>';});
  h+='<tr class="sumRow"><td>Kosten pro Jahr</td><td class="num">'+fmt(fSum)+'</td><td></td></tr></tbody></table>'+
    '<button class="miniBtn ghost" data-act="addFire" style="margin:8px 0 4px">＋ zusätzliche Position (Urlaub, Essen, …)</button>'+
    '<div class="statLine"><span>Kosten pro Monat</span><b class="num">'+fmt(fSum/12)+'</b></div>'+
    '<div class="statLine"><span>Entnahmerate (%)</span><b><input data-scope="settings" data-path="fire.entnahmerate" data-kind="pct" value="'+fmtPct(fire.entnahmerate||0.026)+'" style="width:70px"></b></div>'+
    '<div class="statLine"><span>Benötigtes Vermögen</span><b class="num"><span class="dblRule">'+fmt(noetig)+'</span></b></div>'+
    '<div class="statLine"><span>Ziel-Vermögen</span><b><input data-scope="settings" data-path="fire.vermoegen" data-kind="num" value="'+fmtInp(fire.vermoegen||0)+'" style="width:110px"></b></div></div>';

  // FIRE-Lebenszyklus: Ansparphase (wie Vermögens-Hochrechnung) + Entsparphase
  // (Kosten − AHV/PK-Rente ab Rentenalter) bis zur Lebenserwartung.
  const nowMi2=(year===String(new Date().getFullYear()))?new Date().getMonth():11;
  const accs2=yy.accounts||[];
  const rendite2=depotRendite(yy);
  const nw2=accs2.reduce((a,ac)=>a+acctSaldoAt(ac,nowMi2),0)+rendite2;
  const depotAccs2=findDepotAccs(accs2);
  const depotToday2=depotAccs2.reduce((a,ac)=>a+acctSaldoAt(ac,nowMi2),0)+rendite2;
  const otherToday2=nw2-depotToday2;
  const depotGespart2=depotAccs2.reduce((a,ac)=>a+acctGespart(ac),0);
  const otherGespart2=accs2.reduce((a,ac)=>a+acctGespart(ac),0)-depotGespart2;
  const projRendite2=settings.projRendite||0;
  const projRenditePess2=settings.projRenditePess!=null?settings.projRenditePess:Math.max(0,projRendite2-0.02);
  const projRenditeOpt2=settings.projRenditeOpt!=null?settings.projRenditeOpt:projRendite2+0.02;
  const projInflation2=settings.projInflation!=null?settings.projInflation:0.02;
  const birthYear=fire.birthYear||null;
  const retireAge=fire.retireAge||60;
  const lifeExpectancy=fire.lifeExpectancy||90;
  const pensionAnnual=fire.pensionAnnual||0;
  const pensionStartAge=fire.pensionStartAge||65;
  const curAge=birthYear?(+year-birthYear):null;
  // Simuliert die Ansparphase (wie Vermögens-Hochrechnung) und die Entsparphase ab
  // Erreichen des Zielvermögens für eine gegebene Rendite-Annahme. Entnommen werden
  // die tatsächlichen (inflationsbereinigten) FIRE-Jahreskosten aus der Berechnung
  // oben, nicht nur ein fixer Prozentsatz - die Entnahmerate bestimmt lediglich das
  // Zielvermögen, nicht die effektive jährliche Entnahme.
  function simLifecycle(rate){
    let vd=depotToday2, vo=otherToday2, costs=fSum, fireYr=null, depleteAg=null, sim=[];
    const maxAge=Math.max(lifeExpectancy,curAge)+1;
    for(let a=curAge;a<=maxAge;a++){
      const nwYear=vd+vo;
      if(fireYr==null&&nwYear>=noetig) fireYr=+year+(a-curAge);
      const retired=(fireYr!=null)&&(a>=(fireYr-+year+curAge));
      sim.push({age:a,year:+year+(a-curAge),nw:Math.round(nwYear),retired});
      if(a===maxAge) break;
      if(retired){
        const pension=a>=pensionStartAge?pensionAnnual:0;
        const need=Math.max(0,costs-pension);
        // Entnahme zuerst aus dem nicht wachsenden Cash-Anteil, danach aus dem
        // Depot - das Depot wächst weiter mit der Rendite (wie in der Ansparphase),
        // der Cash-Anteil bleibt weiterhin unverzinst statt beim Pensionsstart
        // plötzlich mit voller Rendite zu wachsen.
        const fromCash=Math.min(vo,need);
        const fromDepot=need-fromCash;
        vo=vo-fromCash;
        const depotAfter=vd*(1+rate)-fromDepot;
        if(depotAfter<0&&depleteAg==null&&a<lifeExpectancy) depleteAg=a+1;
        vd=Math.max(0,depotAfter);
      } else {
        vd=vd*(1+rate)+depotGespart2; vo=vo+otherGespart2;
      }
      costs=costs*(1+projInflation2);
    }
    return {sim,fireYr,sustainable:depleteAg==null,depleteAg};
  }
  let fireYear=null, lifeSim=[], sustainable=null, depleteAge=null, simPess=null, simOpt=null;
  if(curAge!=null&&curAge>=0){
    const r=simLifecycle(projRendite2);
    lifeSim=r.sim; fireYear=r.fireYr; sustainable=r.sustainable; depleteAge=r.depleteAg;
    simPess=simLifecycle(projRenditePess2);
    simOpt=simLifecycle(projRenditeOpt2);
  }
  h+='<p class="sectionCap">FIRE-Lebenszyklus</p><div class="card">'+
    '<p class="hint" style="margin-bottom:8px">Simuliert Ansparphase (wie Vermögens-Hochrechnung) und Entsparphase ab Erreichen des Zielvermögens: Entnommen werden ab dann jährlich die tatsächlichen FIRE-Kosten von oben (inflationsbereinigt) abzüglich AHV/PK-Rente (ab Rentenbeginn) - die Entnahmerate bestimmt nur das Zielvermögen, nicht die effektive Entnahme. Wie bei der Vermögens-Hochrechnung mit Pessimistisch/Realistisch/Optimistisch gerechnet.</p>'+
    '<div class="statLine"><span>Geburtsjahr</span><b><input data-scope="settings" data-path="fire.birthYear" data-kind="int" value="'+(birthYear?fmtIntInp(birthYear):'')+'" placeholder="z.B. 1995" style="width:90px"></b></div>'+
    '<div class="statLine"><span>Rentenalter (AHV/PK)</span><b><input data-scope="settings" data-path="fire.pensionStartAge" data-kind="int" value="'+fmtIntInp(pensionStartAge)+'" style="width:70px"></b></div>'+
    '<div class="statLine"><span>AHV/PK-Rente pro Jahr (ab Rentenalter)</span><b><input data-scope="settings" data-path="fire.pensionAnnual" data-kind="num" value="'+fmtInp(pensionAnnual)+'" style="width:110px"></b></div>'+
    '<div class="statLine"><span>Lebenserwartung (Alter)</span><b><input data-scope="settings" data-path="fire.lifeExpectancy" data-kind="int" value="'+fmtIntInp(lifeExpectancy)+'" style="width:70px"></b></div>';
  if(curAge==null){
    h+='<p class="hint" style="margin-top:8px">Geburtsjahr eingeben, um voraussichtliches FIRE-Jahr und Nachhaltigkeit bis zur Lebenserwartung zu berechnen.</p>';
  } else {
    h+='<div class="statLine"><span>Voraussichtliches FIRE-Jahr</span><b class="num">'+(fireYear?fireYear+' (Alter '+(fireYear-(+year-curAge))+')':'> '+(+year+ (lifeExpectancy-curAge))+' (nicht innert Lebenserwartung erreicht)')+'</b></div>'+
      '<div class="statLine" style="border:none"><span>Nachhaltig bis Lebenserwartung ('+lifeExpectancy+')</span><b class="num '+(sustainable?'pos':'neg')+'">'+(sustainable?'Ja ✓':'Nein – Vermögen reicht nur bis Alter '+depleteAge)+'</b></div>';
  }
  h+='</div>';
  if(curAge!=null&&lifeSim.length){
    h+='<p class="sectionCap">Vermögensverlauf über die Lebenszeit</p><div class="card"><div class="chartBox chartBoxLg"><canvas id="cLifecycle"></canvas></div>'+
      '<p class="hint" style="margin:2px 0 0">Linien antippen/mit der Maus entlangfahren zeigt den Betrag pro Alter für alle drei Szenarien.</p></div>';
  }

  h+='<p class="sectionCap">Jahresvergleich</p><div class="card"><div class="chartBox"><canvas id="cVergleich"></canvas></div></div>';
  $('tabFire').innerHTML=h;
  if(curAge!=null&&lifeSim.length){
    if(chartLifecycle)chartLifecycle.destroy();
    chartLifecycle=new Chart($('cLifecycle'),{type:'line',data:{
      labels:lifeSim.map(p=>p.age),
      datasets:[
        {label:'Pessimistisch',data:simPess.sim.map(p=>p.nw),borderColor:'#e0a458',backgroundColor:'transparent',tension:.25,pointRadius:0,pointHitRadius:12,borderWidth:2},
        {label:'Realistisch',data:lifeSim.map(p=>p.nw),borderColor:'#9184d9',backgroundColor:'rgba(145,132,217,.15)',fill:true,tension:.25,pointRadius:0,pointHitRadius:12,borderWidth:2},
        {label:'Optimistisch',data:simOpt.sim.map(p=>p.nw),borderColor:'#5fbf8f',backgroundColor:'transparent',tension:.25,pointRadius:0,pointHitRadius:12,borderWidth:2}
      ]},
      options:{interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:12}},
          tooltip:{callbacks:{title:items=>'Alter '+items[0].label,label:it=>it.dataset.label+': '+fmt(it.parsed.y)}}},
        layout:{padding:{right:44}},
        scales:{
          x:{title:{display:true,text:'Alter'}},
          y:{ticks:{callback:v=>Math.round(v/1000)+"k"}}}},
      plugins:[endLabelPlugin]});
  }
  const ys=Object.keys(years).sort();
  const ends=ys.map(y=>{const yd=years[y]; const a=(yd.accounts||[]);
    const l13Konto=yd.netto?.lohn13Konto, l13Amt=yd.netto?.lohn13Applied||0;
    return a.reduce((t,ac)=>{const s=accountSaldi(ac)[11]+(ac.name===l13Konto?l13Amt:0);return t+s;},0);});
  if(chartVergleich)chartVergleich.destroy();
  chartVergleich=new Chart($('cVergleich'),{type:'bar',data:{labels:ys,
    datasets:[{label:'Nettowert Ende Jahr',data:ends,backgroundColor:'#9184d9',borderRadius:8}]},
    options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>Math.round(v/1000)+"k"}}}}});
}

async function handleAction(d){
  const yy=Y();
  switch(d.act){
    case 'add': getPath(yy,d.p).push({label:'Neu',value:0}); break;
    case 'copyFixFromPrevYear': {
      const prevY=years[String(+year-1)];
      const prevItems=prevY?.fixkosten?.items;
      if(!prevItems?.length) return;
      if(!confirm('Fixkosten-Positionen (Beträge & Monats-Zuordnung) aus '+(+year-1)+' übernehmen?\n\nBestehende Positionen in '+year+' werden dabei ersetzt.')) return;
      yy.fixkosten.items=JSON.parse(JSON.stringify(prevItems));
      save(year); toast('Fixkosten-Positionen aus '+(+year-1)+' übernommen'); renderTab(); return; }
    case 'toggleFixMonths': {
      const ix=+d.i; const it=yy.fixkosten.items[ix]; if(!it) return;
      if(!Array.isArray(it.flags)||it.flags.length!==12){ it.flags=fixItemFlags(it); save(year); }
      if(openFixMonths.has(ix)) openFixMonths.delete(ix); else openFixMonths.add(ix);
      renderTab(); return; }
    case 'toggleFixFire': {
      const ix=+d.i; const it=yy.fixkosten.items[ix]; if(!it) return;
      it.fireExcluded=!it.fireExcluded; save(year); renderTab(); return; }
    case 'addFromTpl': {
      const list=(settings.templates||{})[d.pool]||[];
      const sel=document.getElementById(d.sel); if(!sel) return;
      const t=list[+sel.value]; if(!t) return;
      getPath(yy,d.p).push({label:t.label,value:t.value}); break; }
    case 'addTpl': (settings.templates=settings.templates||{monat:[],fixkosten:[]});
      (settings.templates[d.pool]=settings.templates[d.pool]||[]).push({label:'Neu',value:0});
      save('settings'); renderTab(); return;
    case 'delTpl': settings.templates[d.pool].splice(+d.i,1); save('settings'); renderTab(); return;
    case 'del': getPath(yy,d.p).splice(+d.i,1); break;
    case 'moveUp': { const arr=getPath(yy,d.p); const i=+d.i;
      if(i>0){ const t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; } else return; break; }
    case 'moveDown': { const arr=getPath(yy,d.p); const i=+d.i;
      if(i<arr.length-1){ const t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t; } else return; break; }
    case 'restNext': yy.calc.next.start=calcSide(yy.calc.current).rest;
      toast('Restguthaben als Startkapital des Folgemonats übernommen'); break;
    case 'monthRoll': {
      if(!confirm('Monatswechsel: Der Folgemonat wird zum aktuellen Monat. Fortfahren?')) return;
      const rest=calcSide(yy.calc.current).rest;
      yy.calc.current=JSON.parse(JSON.stringify(yy.calc.next));
      yy.calc.current.start=rest;
      toast('Folgemonat übernommen – Startkapital = bisheriges Restguthaben'); break; }
    case 'applyProgAll': {
      const ai=+d.i; const el=document.getElementById('progAll_'+ai);
      const acc=yy.accounts[ai]; if(!el||!acc) return;
      const v=pAmt(el.value);
      acc.months=acc.months||MONTHS.map(()=>({plus:0,minus:0}));
      acc.months.forEach(m=>{ m.prognose=v; });
      toast('Prognose für alle 12 Monate auf '+fmt(v)+' gesetzt'); break; }
    case 'addAcc': yy.accounts.push({name:'Neues Konto',start:0,
      months:MONTHS.map(()=>({plus:0,minus:0})),extra:[]}); break;
    case 'delAcc': if(confirm('Konto wirklich löschen?')) yy.accounts.splice(+d.i,1); else return; break;
    case 'toggleAccOptions': {
      const nm=d.name;
      if(openAccOptions.has(nm)) openAccOptions.delete(nm); else openAccOptions.add(nm);
      renderTab(); return; }
    case 'markNotgroschen': {
      const acc=yy.accounts[+d.i]; if(!acc) return;
      settings.notgroschenAccName=acc.name; save('settings');
      toast('„'+acc.name+'“ als Notgroschen-Konto markiert'); renderTab(); return; }
    case 'unmarkNotgroschen': {
      const acc=yy.accounts[+d.i]; if(!acc) return;
      settings.notgroschenAccName=''; save('settings');
      toast('„'+acc.name+'“ ist kein Notgroschen-Konto mehr'); renderTab(); return; }
    case 'markDepot': {
      const acc=yy.accounts[+d.i]; if(!acc) return;
      settings.depotAccNames=settings.depotAccNames||[];
      if(!settings.depotAccNames.includes(acc.name)) settings.depotAccNames.push(acc.name);
      save('settings'); toast('„'+acc.name+'“ als Depot-Konto markiert'); renderTab(); return; }
    case 'unmarkDepot': {
      const acc=yy.accounts[+d.i]; if(!acc||!settings.depotAccNames) return;
      settings.depotAccNames=settings.depotAccNames.filter(n=>n!==acc.name);
      save('settings'); toast('„'+acc.name+'“ ist kein Depot-Konto mehr'); renderTab(); return; }
    case 'markDayLock': {
      const acc=yy.accounts[+d.i]; if(!acc) return;
      settings.dayLockedAccNames=settings.dayLockedAccNames||[];
      if(!settings.dayLockedAccNames.includes(acc.name)) settings.dayLockedAccNames.push(acc.name);
      save('settings'); toast('„'+acc.name+'“: Tages-Sperre aktiviert'); renderTab(); return; }
    case 'unmarkDayLock': {
      const acc=yy.accounts[+d.i]; if(!acc||!settings.dayLockedAccNames) return;
      settings.dayLockedAccNames=settings.dayLockedAccNames.filter(n=>n!==acc.name);
      save('settings'); toast('„'+acc.name+'“: Tages-Sperre entfernt'); renderTab(); return; }
    case 'markSparquoteExcl': {
      const acc=yy.accounts[+d.i]; if(!acc) return;
      settings.sparquoteExcludedAccNames=settings.sparquoteExcludedAccNames||[];
      if(!settings.sparquoteExcludedAccNames.includes(acc.name)) settings.sparquoteExcludedAccNames.push(acc.name);
      save('settings'); toast('„'+acc.name+'“ von der Sparquote ausgeschlossen'); renderTab(); return; }
    case 'unmarkSparquoteExcl': {
      const acc=yy.accounts[+d.i]; if(!acc||!settings.sparquoteExcludedAccNames) return;
      settings.sparquoteExcludedAccNames=settings.sparquoteExcludedAccNames.filter(n=>n!==acc.name);
      save('settings'); toast('„'+acc.name+'“ zählt wieder zur Sparquote'); renderTab(); return; }
    case 'markLohnkonto': {
      const acc=yy.accounts[+d.i]; if(!acc) return;
      if(!confirm('„'+acc.name+'“ mit dem Monat-Startkapital synchronisieren?\n\n'+
        'Der Saldo dieses Kontos im aktuellen Monat wird ab jetzt automatisch mit dem Wert '+
        '„Startkapital Zahlungskonto“ aus dem Monat-Tab überschrieben. Fortfahren?')) return;
      settings.lohnkontoAccName=acc.name;
      save('settings'); toast('„'+acc.name+'“ mit Monat-Startkapital synchronisiert'); renderTab(); return; }
    case 'unmarkLohnkonto': {
      const acc=yy.accounts[+d.i]; if(!acc) return;
      settings.lohnkontoAccName=null;
      save('settings'); toast('Sync entfernt'); renderTab(); return; }
    case 'addAbzug': (yy.netto.items=yy.netto.items||[]).push({label:'Neu',rate:0}); break;
    case 'nettoZuLohn': {
      const netto=nettoCalc(yy.netto).n12;
      ['current','next'].forEach(side=>{
        const inc=yy.calc[side].income;
        const hit=inc.find(i=>/lohn/i.test(i.label||''));
        if(hit) hit.value=netto; else inc.unshift({label:'neuer Lohn',value:netto});
      });
      toast('Nettolohn '+fmt(netto)+' als «neuer Lohn» übernommen'); break; }
    case 'lohnApply': yy.lohnJahr=Math.round(nettoCalc(yy.netto).jahr);
      toast('Netto-Jahreslohn für die Sparquote übernommen'); break;
    case 'lohn13ToKonto': {
      const notAcc=findNotAcc(yy.accounts||[]);
      if(!notAcc){ toast('Kein Sparkonto gefunden – markiere im Konten-Tab eines als Notgroschen-Konto oder benenne es „Sparkonto“'); return; }
      const n13=nettoCalc(yy.netto).n13;
      const prev=yy.netto.lohn13Applied||0;
      notAcc.months=notAcc.months||MONTHS.map(()=>({plus:0,minus:0}));
      const dec=notAcc.months[11]=notAcc.months[11]||{plus:0,minus:0};
      dec.plus=Math.round(((dec.plus||0)-prev+n13)*100)/100;
      yy.netto.lohn13Applied=n13; yy.netto.lohn13Konto=notAcc.name;
      toast('13. Monatslohn '+fmt(n13)+' im Dezember von „'+notAcc.name+'“ verbucht'); break; }
    case 'resyncBrutto13': yy.netto.brutto13Auto=true; yy.netto.brutto13=yy.netto.brutto12||0;
      toast('13. Lohn wieder an 12. Lohn gekoppelt'); break;
    case 'carryOverBalances': {
      const nextYear=String(+year+1);
      if(!years[nextYear]) years[nextYear]=emptyYear();
      const ny=years[nextYear];
      (yy.accounts||[]).forEach(a=>{
        const newStart=acctSaldoAt(a,11);
        let target=(ny.accounts=ny.accounts||[]).find(x=>x.name===a.name);
        if(!target){ target={name:a.name,start:0,months:MONTHS.map(()=>({plus:0,minus:0}))}; ny.accounts.push(target); }
        target.start=newStart;
      });
      save(nextYear);
      toast('Endsaldi als Startkapital für '+nextYear+' übernommen (bleibt editierbar)');
      renderTab(); return; }
    case 'addInv': (yy.investments=yy.investments||[]).push({date:new Date().toISOString().slice(0,10),label:'Neu',amount:0}); break;
    case 'addFire': settings.fire.items.push({label:'Neu',value:0}); save('settings'); renderTab(); return;
    case 'delFire': settings.fire.items.splice(+d.i,1); save('settings'); renderTab(); return;
    case 'moveFireUp': { const arr=settings.fire.items; const i=+d.i;
      if(i>0){ const t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; save('settings'); renderTab(); } return; }
    case 'moveFireDown': { const arr=settings.fire.items; const i=+d.i;
      if(i<arr.length-1){ const t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t; save('settings'); renderTab(); } return; }
    case 'addRule': (settings.rules=settings.rules||[]).push({nr:(settings.rules.length+1)+'.',text:''}); save('settings'); renderTab(); return;
    case 'delRule': settings.rules.splice(+d.i,1); save('settings'); renderTab(); return;
    case 'newYear': {
      const prev=years[String(+year-1)];
      const ny=prev?JSON.parse(JSON.stringify(prev)):emptyYear();
      if(prev){
        const l13Konto=prev.netto?.lohn13Konto, l13Amt=prev.netto?.lohn13Applied||0;
        ny.accounts.forEach(a=>{a.start=(accountSaldi(a)[11]??a.start)+(a.name===l13Konto?l13Amt:0);
          a.months=MONTHS.map(()=>({plus:0,minus:0}));});
        ny.fixkosten.base=0; ny.fixkosten.monate=MONTHS.map((m,i)=>({monat:m,ein:prev.fixkosten?.transfer||0,abg:0}));
        ny.investments=[]; ny.ccOwn=[]; ny.ccShared=[];
        ny.calc.current.start=calcSide(prev.calc.next).rest;
      }
      years[year]=ny; break; }
    case 'blankYear': years[year]=emptyYear(); break;
    case 'importSeed': document.getElementById('seedFile').click(); return;
    case 'exportJson': {
      const blob=new Blob([JSON.stringify({settings,years},null,1)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='lohnkalkulation-backup.json';a.click(); return; }
    case 'toggleNotify': {
      if(!settings.notifyEnabled){
        if(typeof Notification==='undefined'){ toast('Wird von diesem Browser nicht unterstützt'); return; }
        const perm=await Notification.requestPermission();
        if(perm!=='granted'){ toast('Berechtigung nicht erteilt'); return; }
        settings.notifyEnabled=true; toast('Erinnerungen aktiviert');
      }else{
        settings.notifyEnabled=false; toast('Erinnerungen deaktiviert');
      }
      save('settings'); renderTab(); return; }
    case 'logout': auth.signOut(); return;
    case 'deleteAccount': {
      if(!confirm('Account und ALLE gespeicherten Daten wirklich unwiderruflich löschen? Das kann nicht rückgängig gemacht werden.')) return;
      const user=auth.currentUser; if(!user) return;
      try{
        const docs=await col().get();
        await Promise.all(docs.docs.map(d=>d.ref.delete()));
        await user.delete();
        toast('Account gelöscht');
      }catch(err){
        if(err?.code==='auth/requires-recent-login'){
          toast('Aus Sicherheitsgründen musst du dich neu anmelden, bevor der Account gelöscht werden kann. Bitte abmelden, erneut einloggen und nochmal versuchen.');
        }else toast('Löschen fehlgeschlagen: '+(err?.message||err));
      }
      return; }
    default: return;
  }
  save(year); renderTab();
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='seedFile'||!e.target.files[0]) return;
  try{
    const seed=JSON.parse(await e.target.files[0].text());
    settings={...settings,...seed.settings};
    for(const [yr,data] of Object.entries(seed.years||{})){
      years[yr]=normalizeYear({...(years[yr]||{}),...data}); dirty[yr]=true;
    }
    dirty['settings']=true;
    toast('Importiere und speichere …');
    const ok=await flushSave();
    if(ok) toast('Alle Jahre importiert und gespeichert ✓');
    renderTab();
  }catch(err){ toast('Import fehlgeschlagen: keine gültige seed.json'); }
  e.target.value='';
});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      reg.update().catch(()=>{});
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        // Nur bei einem echten Update neu laden, nicht bei der allerersten Installation
        if(!nw||!navigator.serviceWorker.controller) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='activated') location.reload();
        });
      });
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
